name: Build Desktop Executables

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --noconfirm --onedir --windowed --add-data "frontend/static;frontend/static" --name "EmpyrionPlayfieldDebugger" main.py

    - name: Build with PyInstaller (Linux)
      if: runner.os == 'Linux'
      run: |
        pyinstaller --noconfirm --onedir --windowed --add-data "frontend/static:frontend/static" --name "EmpyrionPlayfieldDebugger" main.py

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: EmpyrionPlayfieldDebugger-${{ runner.os }}
        path: dist/EmpyrionPlayfieldDebugger
